name: PythonX Build

on:
  push:
    branches: [python-3.14]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: ./configure --with-pydebug

      - name: Add PythonX core objects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Makefile')
          s = p.read_text()
          marker = 'Python/asdl.o \\\n'
          objects = ''.join(
              f'\t\tPython/{name}.o \\\n' for name in [
                  'pythonx_ir',
                  'pythonx_backend',
                  'pythonx_native_ir',
                  'pythonx_compile',
                  'pythonx_errors',
                  'pythonx_traceback',
                  'pythonx_error_runtime',
                  'pythonx_error_statements',
              ]
          )
          if objects.strip() not in s:
              if marker not in s:
                  raise SystemExit('Could not locate PYTHON_OBJS insertion point')
              s = s.replace(marker, marker + objects, 1)
              p.write_text(s)
          PY

      - name: Build
        run: make -j2

      - name: Verify interpreter
        run: ./python -c 'print("PythonX build completed")'
